databases:
  - name: boomberry-db
    plan: free
    databaseName: boomberry
    user: boomberry

services:
  - type: web
    name: boomberry-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boomberry-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: ZALOPAY_APP_ID
        value: "15847"
      - key: ZALOPAY_KEY1
        value: "0U93tRzdWEkMLVNYH90aBu5ca0Psql8T"
      - key: ZALOPAY_KEY2
        value: "PurTcToVhvUt7vR2jO6He4lh3nfNEiks"
      - key: ZALOPAY_ENDPOINT
        value: "https://sb-openapi.zalopay.vn/v2/"
      # URL backend that da duoc deploy (khong phai ten mac dinh o tren)
      - key: ZALOPAY_CALLBACK_URL
        value: "https://dinh-coffee.onrender.com/api/payments/zalopay/callback"
      # Deep link quay lai Mini App that sau khi thanh toan xong tren ZaloPay
